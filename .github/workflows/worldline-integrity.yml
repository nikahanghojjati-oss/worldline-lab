name: Worldline Truth Engine v0.2 integrity
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/truth-engine/**"
      - "tools/hammer/**"
      - "HAMMER.md"
      - "research/hammer-*.md"
      - "tools/site-browser-smoke.cjs"
      - "tools/site-axe-audit.cjs"
      - "assets/**"
      - "index.html"
      - ".github/workflows/worldline-integrity.yml"
  pull_request:
    paths:
      - "data/**"
      - "tools/truth-engine/**"
      - "tools/hammer/**"
      - "HAMMER.md"
      - "research/hammer-*.md"
      - "tools/site-browser-smoke.cjs"
      - "tools/site-axe-audit.cjs"
      - "assets/**"
      - "index.html"
      - ".github/workflows/worldline-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Worldline Lab
        uses: actions/checkout@v4
      - name: Install supported Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit source and claim dependencies
        run: node tools/truth-engine/validate.cjs
      - name: Execute intentionally failing integrity fixtures
        run: node tools/truth-engine/test.cjs
      - name: HAMMER adversarial theory forge and AI review input gates
        run: |
          node tools/hammer/test.cjs
          node tools/hammer/run.cjs --check
          node tools/hammer/identifiability-test.cjs
          node tools/hammer/separation-design-test.cjs
          node tools/hammer/source-critique-test.cjs
          node tools/hammer/source-critique.cjs
          node tools/hammer/identifiability.cjs
          node tools/hammer/separation-design.cjs
      - name: Reconstruct 2016 original experiment and GRW scaling
        run: node tools/truth-engine/macrorealism-reproduce.cjs
      - name: Reproduce source-grounded Born-equilibrium no-go and undo calculation
        run: node tools/truth-engine/ontology-identifiability.cjs
      - name: Validate public JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/hammer-core.js
          node --check assets/hammer-discovery.js
          node --check assets/hammer-ui.js
          node --check tools/hammer/ai-panel.cjs
          node --check assets/library.js
          node --check assets/lab-experience.js

  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Worldline Lab
        uses: actions/checkout@v4
      - name: Install Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test 8 routes and 9 x 3 lab views at desktop and phone widths
        run: node tools/site-browser-smoke.cjs
      - name: Install axe WCAG automation
        run: npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Audit WCAG serious and critical violations across all routes and priority labs
        run: node tools/site-axe-audit.cjs
