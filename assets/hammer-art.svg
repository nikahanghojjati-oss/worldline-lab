<radialGradient id="forge"><stop stop-color="#c2f9ff" stop-opacity=".95"/><stop offset=".2" stop-color="#45b3d6" stop-opacity=".52"/><stop offset="1" stop-color="#1a7ba6" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="drop"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000d19" flood-opacity=".7"/></filter>
