<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="t d">
<title id="t">HAMMER — scientific research forge</title>
<desc id="d">A luminous copper and blue hammer above nested mathematical orbit lines and a dark stellar research field; an artistic metaphor for rigorous experiment design and scientific criticism.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#15466b"/><stop offset=".52" stop-color="#082b44"/><stop offset="1" stop-color="#071625"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2=".94" y2="1"><stop stop-color="#f2d5aa"/><stop offset=".23" stop-color="#a67453"/><stop offset=".5" stop-color="#30485c"/><stop offset=".72" stop-color="#94c8d3"/><stop offset="1" stop-color="#223950"/></linearGradient>
